<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface flex flex-col items-center justify-center min-h-screen overflow-hidden">
<!-- Screen Container (iPhone Simulation) -->
<main class="w-full max-w-[430px] h-[932px] bg-surface relative flex flex-col px-8 pt-20 pb-12 shadow-2xl rounded-[3rem] border-8 border-surface-container-highest overflow-hidden">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mb-12">
<div class="w-16 h-16 bg-primary-container/10 rounded-2xl flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="shield_with_heart">shield_with_heart</span>
</div>
<h1 class="text-primary font-headline text-3xl font-extrabold tracking-tight mb-2">MediAgent</h1>
<p class="text-secondary text-lg font-medium opacity-80">Welcome back</p>
</header>
<!-- Login Form Card -->
<section class="flex-grow flex flex-col">
<div class="bg-surface-container-lowest rounded-3xl p-8 shadow-[0px_12px_32px_rgba(25,28,30,0.06)] border border-outline-variant/10">
<h2 class="text-on-surface text-2xl font-bold mb-8">Log In</h2>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-secondary font-medium text-sm ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-2xl py-4 px-5 text-lg text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:bg-white transition-all" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-secondary font-medium text-sm ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-2xl py-4 px-5 text-lg text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary focus:bg-white transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end pt-1">
<a class="text-primary font-semibold text-sm hover:underline decoration-2 underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Primary CTA -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-xl py-5 rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-98 transition-all duration-200 mt-4" type="submit">
                        Log In
                    </button>
</form>
</div>
</section>
<!-- Bottom Action -->
<footer class="mt-auto text-center">
<button class="group py-4 px-6 rounded-full hover:bg-surface-container transition-colors whitespace-nowrap flex items-center justify-center w-full"><div class="flex flex-col items-center gap-1"><span class="text-secondary font-medium">Don’t have an account?</span> <span class="text-primary font-bold group-hover:underline decoration-2 underline-offset-4">Create Account</span></div></button>
</footer>
<!-- Bottom Indicator (iOS style) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-surface-container-highest rounded-full"></div>
</main>
<!-- Background Decoration for Aesthetic -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary/5 rounded-full blur-3xl"></div>
<img class="absolute top-0 left-0 w-full h-full object-cover opacity-[0.03] mix-blend-overlay" data-alt="abstract soft medical texture with clean bright clinic surfaces and gentle blue lighting tones for professional calm atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNrsaEqCoT5jhCG_Tq3g8qOqMckqB8fHEc-JTgu8EruU57lmVyEJGGyiUS0NiSQYEErGzNvadk0iSmkVYx21MY6J6O02aejm6aQ7J1RAAuO5O3oJDe9VW_0SJSLmrQ1Lsiy4kErISiRkzb_JD52xoHRv3-X-it6A8DsuCmnXhVcuG_iUEJ4o6GxiS2R_1k6kGJTbtoHr__ixEtPZB2kSOeJP9vqMezCawnLrUGrniDP4Aj3gvIAHYJLVy-uslj8KL7ITm6zk3ay_3f"/>
</div>
