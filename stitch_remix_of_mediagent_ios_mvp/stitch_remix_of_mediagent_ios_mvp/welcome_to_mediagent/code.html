<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MediAgent Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

                    "secondary-container": "#cfe6f2",
                    "primary-fixed": "#d7e3ff",
                    "on-tertiary-fixed": "#261a00",
                    "surface-container-low": "#f2f4f7",
                    "on-background": "#191c1e",
                    "primary": "#004e9f",
                    "primary-container": "#0066cc",
                    "on-tertiary-container": "#ffe6b7",
                    "outline": "#727784",
                    "on-secondary-fixed": "#071e27",
                    "on-tertiary-fixed-variant": "#5c4300",
                    "on-surface-variant": "#414753",
                    "tertiary-fixed": "#ffdfa0",
                    "surface-tint": "#005cba",
                    "inverse-surface": "#2d3133",
                    "surface-container-highest": "#e0e3e6",
                    "tertiary-fixed-dim": "#f8bd2a",
                    "primary-fixed-dim": "#aac7ff",
                    "surface-container-high": "#e6e8eb",
                    "on-primary-fixed-variant": "#00458e",
                    "on-primary-container": "#dfe8ff",
                    "inverse-on-surface": "#eff1f4",
                    "tertiary-container": "#866300",
                    "error": "#ba1a1a",
                    "on-secondary-fixed-variant": "#354a53",
                    "background": "#f7f9fc",
                    "surface-dim": "#d8dadd",
                    "secondary-fixed-dim": "#b4cad6",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-container": "#eceef1",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f7f9fc",
                    "on-surface": "#191c1e",
                    "surface-variant": "#e0e3e6",
                    "secondary-fixed": "#cfe6f2",
                    "on-primary-fixed": "#001b3e"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",

            "fontFamily": {
                    "headline": ["Lexend"],
                    "body": ["Lexend"],
                    "label": ["Lexend"]

<style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-full overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile Shell (iOS Centric) -->
<main class="relative h-full w-full max-w-md mx-auto flex flex-col justify-between items-center bg-surface overflow-hidden">
<!-- TopAppBar: Clinical Sanctuary (Shared Component) -->
<header class="w-full pt-8 flex flex-col items-center justify-center px-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-blue-800 dark:text-blue-400" style="font-size: 28px;">health_and_safety</span>
<h1 class="text-2xl font-bold tracking-tight text-blue-800 dark:text-blue-300 font-headline">MediAgent</h1>
</div>
<!-- Subtitle/Brand context from JSON branding -->
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium uppercase tracking-widest mt-1">Empathetic Guardian</p>
</header>
<!-- Main Body: Hero Section -->
<div class="flex-1 flex flex-col items-center justify-center px-8 w-full text-center">
<!-- Visual: Abstract Healthcare Illustration with Glass Effect -->
<div class="relative w-64 h-64 mb-12 flex items-center justify-center">
<!-- Decorative Tonal Circles for Depth -->
<div class="absolute inset-0 bg-primary-container opacity-10 rounded-full blur-3xl"></div>
<div class="absolute top-4 right-4 w-32 h-32 bg-secondary-container opacity-20 rounded-full blur-2xl"></div>
<!-- The Core Visual Component -->
<div class="relative z-10 glass-panel rounded-[3rem] p-10 flex items-center justify-center shadow-xl border border-white/30">
<div class="relative">
<span class="material-symbols-outlined text-primary text-8xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<!-- Secondary accent icon -->
<div class="absolute -top-4 -right-4 bg-tertiary-fixed text-on-tertiary-fixed p-3 rounded-2xl shadow-lg">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">pill</span>
</div>
</div>
</div>
</div>
<!-- Copy -->
<div class="space-y-4 max-w-xs mx-auto">
<h2 class="text-4xl font-extrabold text-on-surface tracking-tight leading-[1.15]">
                    Stay safe with every dose
                </h2>
<p class="text-on-surface-variant text-base leading-relaxed font-normal px-2">
                    Track medications, monitor health signals, and stay connected with caregivers.
                </p>
</div>
</div>
<!-- Bottom: Action Section -->
<footer class="w-full px-8 pb-12 pt-4">
<div class="flex flex-col gap-4">
<!-- Prominent Full-Width 'Get Started' Button -->
<button class="w-full h-16 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg shadow-lg hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Get Started
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<!-- Secondary Support Action -->
<button class="w-full h-12 rounded-full text-secondary font-medium text-sm hover:bg-surface-container transition-colors">
                    Already have an account? Log in
                </button>
</div>
<!-- Legal/Privacy Microcopy -->
<p class="mt-6 text-center text-[10px] text-outline-variant uppercase tracking-widest leading-none">
                Privacy First • Clinical Precision • 24/7 Monitoring
            </p>
</footer>
<!-- Decorative Background Layer (No-Line philosophy) -->
<div class="fixed inset-0 -z-10 pointer-events-none">
<div class="absolute top-0 left-0 w-full h-[265px] bg-gradient-to-b from-surface-container-low to-transparent"></div>
<div class="absolute bottom-0 right-0 w-full h-[176px] bg-gradient-to-t from-surface-container-lowest to-transparent"></div>
</div>
</main>
<!-- Contextual Aesthetic Overlay -->
<div class="hidden">
<img data-alt="soft blurred medical background with gentle blue and white gradients, minimalist and clean sanctuary aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCad-v1wLpVxvNW43mGZuvdCekbwQTFOfQ1RMmIdlNbIJ1RL33buwQWZByr6qVXDIVXYlwnodPHtKYDZp0cGFNWNmmpHkphZ3jRlVvi-9jvdlfZegkiikTF9tPLavKgp7BRlhusIjG600J_rB7HbMZ9fpPYNWEc77CTAXd9iaSnco2sju4MKxCF5x4TSExeiOzumMqYQgjU34cqBf3DPB765UByqr8JRMXT2Hp2kvmD-3z_879bwpHH1__EB7E4Ut2-RnMLFrN7Umx9"/>
</div>
</body></html>
