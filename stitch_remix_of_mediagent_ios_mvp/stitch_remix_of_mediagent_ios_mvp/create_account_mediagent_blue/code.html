<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MediAgent - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#cfe6f2",
                    "on-surface": "#191c1e",
                    "surface-container-highest": "#e0e3e6",
                    "error": "#ba1a1a",
                    "on-tertiary-container": "#ffe6b7",
                    "on-background": "#191c1e",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d8dadd",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed": "#261a00",
                    "on-primary-container": "#dfe8ff",
                    "on-error": "#ffffff",
                    "on-secondary-fixed": "#071e27",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e6e8eb",
                    "on-primary": "#ffffff",
                    "primary-fixed": "#d7e3ff",
                    "outline": "#727784",
                    "surface-container": "#eceef1",
                    "surface-variant": "#e0e3e6",
                    "primary-fixed-dim": "#aac7ff",
                    "on-primary-fixed-variant": "#00458e",
                    "surface-bright": "#f7f9fc",
                    "inverse-surface": "#2d3133",
                    "primary-container": "#0066cc",
                    "outline-variant": "#c1c6d5",
                    "on-secondary-fixed-variant": "#354a53",
                    "primary": "#004e9f",
                    "surface": "#f7f9fc",
                    "tertiary-container": "#866300",
                    "surface-tint": "#005cba",
                    "tertiary-fixed-dim": "#f8bd2a",
                    "on-primary-fixed": "#001b3e",
                    "on-surface-variant": "#414753",
                    "secondary-container": "#cfe6f2",
                    "tertiary-fixed": "#ffdfa0",
                    "inverse-on-surface": "#eff1f4",
                    "background": "#f7f9fc",
                    "on-tertiary-fixed-variant": "#5c4300",
                    "surface-container-low": "#f2f4f7",
                    "on-secondary-container": "#526772",
                    "tertiary": "#684c00",
                    "secondary-fixed-dim": "#b4cad6",
                    "inverse-primary": "#aac7ff",
                    "secondary": "#4c616c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Lexend"],
                    "body": ["Lexend"],
                    "label": ["Lexend"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Lexend', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<!-- Top Navigation Anchor -->
<header class="w-full pt-8 pb-4 sticky top-0 bg-[#f7f9fc] backdrop-blur-xl z-50">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto relative">
<button class="absolute left-6 text-blue-700 hover:bg-slate-200/50 transition-colors p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center justify-center w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-blue-800 dark:text-blue-400" style="font-size: 28px;">health_and_safety</span>
<h1 class="text-2xl font-bold tracking-tight text-blue-800 dark:text-blue-300 font-headline">MediAgent</h1>
</div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium uppercase tracking-widest mt-1">Empathetic Guardian</p>
</div>
</div>
</header>
<main class="flex-grow flex flex-col justify-center px-8 py-4 max-w-md mx-auto w-full">
<!-- Hero Section / Header Text -->
<div class="mb-8">
<h1 class="text-4xl font-extrabold text-primary tracking-tight mb-3">Create Account</h1>
<p class="text-body-large text-secondary leading-relaxed font-light">Join MediAgent to manage medications and stay connected.</p>
</div>
<!-- Create Account Form -->
<form class="space-y-5" onsubmit="return false;">
<!-- Full Name -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="full-name">Full Name</label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline-variant text-lg" id="full-name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="email">Email Address</label>
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline-variant text-lg" id="email" placeholder="name@example.com" type="email"/>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative group">
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline-variant text-lg" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center p-2" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Terms of Service -->
<div class="flex items-start gap-3 pt-2">
<div class="relative flex items-center">
<input class="w-6 h-6 rounded-lg border-outline-variant text-primary focus:ring-primary cursor-pointer bg-surface-container-low" id="terms" type="checkbox"/>
</div>
<label class="text-sm leading-tight text-on-surface-variant cursor-pointer" for="terms">
                    By creating an account, you agree to our <span class="text-primary font-medium">Terms of Service</span> and <span class="text-primary font-medium">Privacy Policy</span>.
                </label>
</div>
<!-- Primary CTA -->
<div class="pt-4">
<button class="w-full h-16 bg-gradient-to-r from-primary to-primary-container text-white rounded-full font-bold text-xl shadow-lg hover:shadow-primary/20 hover:brightness-105 active:scale-95 transition-all flex items-center justify-center gap-3" type="submit">
                    Create Account
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold ml-1 hover:underline decoration-2 underline-offset-4" href="#">Log In</a>
</p>
</div>
</main>
<!-- Support Section (Bento Style Sub-navigation) -->
<div class="px-8 pb-10 w-full max-w-md mx-auto">
<div class="bg-surface-container-highest/30 rounded-3xl p-6 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="contact_support">contact_support</span>
</div>
<div>
<p class="text-sm font-bold text-on-surface">Need help?</p>
<p class="text-xs text-on-surface-variant">Talk to our care team</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Mandatory Footer Navigation suppressed for focused transaction screen -->
</body></html>
