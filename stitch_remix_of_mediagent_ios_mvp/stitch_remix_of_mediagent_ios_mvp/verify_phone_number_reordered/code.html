            </p>
</div>
<!-- Input Area: 6-Digit Verification -->

<input autofocus="" class="w-full aspect-square text-center text-3xl font-bold bg-surface-container-lowest text-primary rounded-xl outline-variant focus:ring-2 focus:ring-primary focus:border-primary border-none shadow-sm transition-all" maxlength="1" placeholder="•" type="text"/>

<input class="w-full aspect-square text-center text-3xl font-bold bg-surface-container-lowest text-primary rounded-xl outline-variant focus:ring-2 focus:ring-primary focus:border-primary border-none shadow-sm transition-all" maxlength="1" placeholder="•" type="text"/>
<input class="w-full aspect-square text-center text-3xl font-bold bg-surface-container-lowest text-primary rounded-xl outline-variant focus:ring-2 focus:ring-primary focus:border-primary border-none shadow-sm transition-all" maxlength="1" placeholder="•" type="text"/>
</div>

<div class="flex flex-col items-center gap-3">
<p class="text-on-surface-variant font-medium">Didn't receive a code?</p>
<button class="bg-surface-container-high text-on-surface-variant px-5 py-2 rounded-full text-sm font-medium hover:bg-surface-container-highest transition-colors active:scale-95">
                    Resend in 0:45
                </button>
</div>
<button class="w-full py-5 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg rounded-full shadow-lg hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Verify and Continue</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
