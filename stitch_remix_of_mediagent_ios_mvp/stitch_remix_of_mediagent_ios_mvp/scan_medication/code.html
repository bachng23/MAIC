<!DOCTYPE html>

<style>
        body { font-family: 'Lexend', sans-serif; background-color: #f7f9fc; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .viewfinder-mask {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
        .scan-guide {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-xl flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-150 text-blue-800 dark:text-blue-400">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-lexend text-lg font-semibold tracking-tight text-blue-800 dark:text-blue-400">Scan Medication</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-20 pb-32 px-6 flex flex-col items-center justify-center space-y-8">
<!-- Header Text -->
<div class="text-center space-y-3 max-w-sm">
<h2 class="text-2xl font-bold text-on-surface leading-tight">Align the medication label inside the frame</h2>
<p class="text-on-surface-variant text-base">Make sure the label is clear and well lit. Hold your iPhone steady while scanning.</p>
</div>
<!-- Camera Viewfinder Section -->
<div class="relative w-full aspect-[3/4] max-w-md rounded-[2.5rem] overflow-hidden bg-black shadow-2xl">
<!-- Simulated Camera Feed -->
<img alt="Camera feed showing a close up of a medicine bottle on a neutral surface" class="absolute inset-0 w-full h-full object-cover opacity-80" data-alt="Close-up POV of a white medication bottle with a clear prescription label being held against a soft grey background with bright overhead light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5s5t3Zt7yieOyD3R_pl3Tl1AVJhhf8c-RHkNp7hCeA8TEDGSaU1qjDjCC2DvuQlpiip0S1lRV0nFAWYIX8j2jHEaqUnD_tSqEvESFlG8PYXTs94HcbAYmJnHAHepRaD4RfWfsbqDbrp3TZ38n-4qe8EOATIJFWcL4-T_nu60GLrjJ4HgAlFQ9CDyFy4iTjvSJWnamtBuSA9kyBwkjDDXza8A645PYAN7KibzdunY6HnAFOGN-WwGULXrekHZtBHR1cX4WGUYMaH4G"/>
<!-- Scanning Guide Overlay -->
<div class="absolute inset-0 flex items-center justify-center p-8">
<div class="w-full aspect-[4/3] border-2 border-primary-fixed-dim rounded-3xl scan-guide relative">
<!-- Corner Brackets -->
<div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
<div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
<div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
<div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
<!-- Pulsing Scan Line (Visual Cue) -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/40 blur-sm"></div>
</div>
</div>
<!-- Viewfinder Icons -->
<div class="absolute top-6 right-6 flex flex-col gap-4">
<button class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center text-white border border-white/20 active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</button>
</div>
</div>
<!-- Info Note -->
<div class="bg-surface-container-low p-5 rounded-2xl flex items-start gap-4 max-w-sm border border-outline-variant/10">
<span class="material-symbols-outlined text-primary" data-icon="info">info</span>
<p class="text-sm text-on-surface-variant font-medium leading-relaxed">
                We will identify the medication name and prepare reminder details automatically.
            </p>
</div>
</main>
<!-- Sticky Action Area -->
<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-xl px-6 pt-6 pb-12 flex flex-col gap-4 items-center">
<!-- Scan Button -->
<button class="w-full max-w-md py-5 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
            Scan Now
        </button>
<!-- Secondary Action -->
<button class="py-3 px-8 rounded-full text-primary font-semibold text-base hover:bg-primary/5 active:scale-95 transition-all flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="image">image</span>
            Upload from Photos
        </button>
</div>
<!-- BottomNavBar (Suppressed for focused task) -->
<!-- As per instructions: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Task-Focused" -->
</body></html>
